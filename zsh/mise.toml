[tools]
# Dev tools
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"

[tasks.format]
description = "Run code formatters"
alias = ["f"]
run = ["shfmt -w -- local-plugins mise-tasks", "taplo format "]

[tasks.all]
description = "Run all tasks"
alias = ["a"]
depends = ["format", "clean", "link"]
